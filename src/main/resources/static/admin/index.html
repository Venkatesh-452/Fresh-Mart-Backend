<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreshMart Admin</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <span class="brand-mark">FM</span>
        <div>
            <h1>FreshMart</h1>
            <p>Admin Panel</p>
        </div>
    </div>
    <nav class="nav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="categories">Categories</button>
        <button class="nav-item" data-view="vegetables">Vegetables</button>
        <button class="nav-item" data-view="inventory">Inventory</button>
        <button class="nav-item" data-view="orders">Orders</button>
        <button class="nav-item" data-view="payments">Payments</button>
    </nav>
</aside>

<main class="shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">Operations</p>
            <h2 id="viewTitle">Dashboard</h2>
        </div>
        <div class="session">
            <span id="sessionLabel">Not logged in</span>
            <button id="logoutBtn" class="ghost hidden" type="button">Logout</button>
        </div>
    </header>

    <section id="loginPanel" class="panel login-panel">
        <div>
            <h3>Admin Login</h3>
            <p>Use an account whose role is ADMIN.</p>
        </div>
        <form id="loginForm" class="form compact-form">
            <label>Email
                <input name="email" type="email" required placeholder="admin@gmail.com">
            </label>
            <label>Password
                <input name="password" type="password" required placeholder="admin123">
            </label>
            <button type="submit">Login</button>
        </form>
    </section>

    <div id="appContent" class="hidden">
        <section id="dashboard" class="view active">
            <div class="stats">
                <article class="stat">
                    <span>Categories</span>
                    <strong id="categoryCount">0</strong>
                </article>
                <article class="stat">
                    <span>Vegetables</span>
                    <strong id="vegetableCount">0</strong>
                </article>
                <article class="stat">
                    <span>Orders</span>
                    <strong id="orderCount">0</strong>
                </article>
                <article class="stat">
                    <span>Pending Payments</span>
                    <strong id="pendingPaymentCount">0</strong>
                </article>
            </div>
        </section>

        <section id="categories" class="view">
            <div class="split">
                <section class="panel">
                    <h3 id="categoryFormTitle">Create Category</h3>
                    <form id="categoryForm" class="form">
                        <input type="hidden" name="id">
                        <label>Name
                            <input name="name" required minlength="2" maxlength="100">
                        </label>
                        <label>Description
                            <textarea name="description" maxlength="500"></textarea>
                        </label>
                        <div class="actions">
                            <button type="submit">Save Category</button>
                            <button id="resetCategoryBtn" class="ghost" type="button">Reset</button>
                        </div>
                    </form>
                </section>
                <section class="panel wide">
                    <div class="panel-head">
                        <h3>Categories</h3>
                        <button id="refreshCategoriesBtn" class="ghost" type="button">Refresh</button>
                    </div>
                    <div id="categoryList" class="list"></div>
                </section>
            </div>
        </section>

        <section id="vegetables" class="view">
            <div class="split">
                <section class="panel">
                    <h3 id="vegetableFormTitle">Create Vegetable</h3>
                    <form id="vegetableForm" class="form">
                        <input type="hidden" name="id">
                        <label>Name
                            <input name="name" required minlength="2" maxlength="100">
                        </label>
                        <label>Description
                            <textarea name="description" maxlength="500"></textarea>
                        </label>
                        <div class="grid-two">
                            <label>Price
                                <input name="price" type="number" step="0.01" min="0.01" required>
                            </label>
                            <label>Quantity
                                <input name="quantity" type="number" step="0.01" min="0" required>
                            </label>
                        </div>
                        <div class="grid-two">
                            <label>Unit
                                <input name="unit" required placeholder="kg">
                            </label>
                            <label>Category
                                <select name="categoryId" required></select>
                            </label>
                        </div>
                        <label>Image URL
                            <input name="imageUrl" type="url">
                        </label>
                        <div class="actions">
                            <button type="submit">Save Vegetable</button>
                            <button id="resetVegetableBtn" class="ghost" type="button">Reset</button>
                        </div>
                    </form>
                </section>
                <section class="panel wide">
                    <div class="panel-head">
                        <h3>Vegetables</h3>
                        <button id="refreshVegetablesBtn" class="ghost" type="button">Refresh</button>
                    </div>
                    <div id="vegetableList" class="list"></div>
                </section>
            </div>
        </section>

        <section id="inventory" class="view">
            <div class="split">
                <section class="panel">
                    <h3>Add Stock</h3>
                    <form id="stockForm" class="form">
                        <label>Vegetable
                            <select name="vegetableId" required></select>
                        </label>
                        <label>Quantity
                            <input name="quantity" type="number" step="0.01" min="0.01" required>
                        </label>
                        <button type="submit">Add Stock</button>
                    </form>
                </section>
                <section class="panel wide">
                    <div class="panel-head">
                        <h3>Inventory</h3>
                        <button id="refreshInventoryBtn" class="ghost" type="button">Refresh</button>
                    </div>
                    <div id="inventoryList" class="list"></div>
                </section>
            </div>
        </section>

        <section id="orders" class="view">
            <section class="panel">
                <div class="panel-head">
                    <h3>Orders</h3>
                    <button id="refreshOrdersBtn" class="ghost" type="button">Refresh</button>
                </div>
                <div id="orderList" class="list"></div>
            </section>
        </section>

        <section id="payments" class="view">
            <section class="panel">
                <div class="panel-head">
                    <h3>Payments</h3>
                    <div class="actions">
                        <button id="refreshPaymentsBtn" class="ghost" type="button">All</button>
                        <button id="pendingPaymentsBtn" class="ghost" type="button">Pending</button>
                    </div>
                </div>
                <div id="paymentList" class="list"></div>
            </section>
        </section>
    </div>

    <div id="toast" class="toast hidden"></div>
</main>

<script src="./app.js"></script>
</body>
</html>
